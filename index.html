<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151D; --surface:#1B1F2A; --surface2:#232837; --ink:#ECEEF4; --muted:#9EA5B6; --line:#2C3242;

  --in:#4CC8B3; --in-soft:#173430; --out:#F08A6F; --out-soft:#3A2420; --warn:#E9BF55; --warn-soft:#352C14; color-scheme:dark}}
:root[data-theme="dark"]{

.turma{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface2);cursor:pointer}

.capa{position:relative;margin:-40px -16px 0;padding:44px 24px 30px;text-align:center;color:#fff;border-radius:0 0 32px 32px;overflow:hidden;

.atest-zoom-box img{width:100%;max-height:calc(100vh - 120px);object-fit:contain;border-radius:12px;background:#fff}
.s.enc{color:var(--out);display:block}
.s.perdao{color:var(--in);display:block;font-weight:600}
.link.enc-tirar{font-size:.8rem;align-self:flex-start;display:block;margin-top:2px}
.legal{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.legal .link{color:var(--muted);font-weight:600}
.check.aceite{align-items:flex-start;font-weight:500;font-size:.9rem;line-height:1.45}
.check.aceite input{margin-top:2px;flex:none}
.consent{gap:12px}
.consent-lista{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.doc-legal-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.48);display:flex;align-items:flex-end;justify-content:center}
.doc-legal{background:var(--bg);width:100%;max-width:720px;max-height:94%;overflow:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.doc-legal .doc-fechar{align-self:flex-end;position:sticky;top:0}
.doc-corpo h1{font-family:var(--f-display);font-size:1.5rem;margin:0}
.doc-corpo h2{font-size:1.05rem;color:var(--accent);margin:22px 0 6px}
.doc-corpo p,.doc-corpo li{font-size:.93rem;line-height:1.55}
.doc-corpo .meta{color:var(--muted);font-size:.85rem}
.doc-corpo .rascunho{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:.86rem}
.doc-corpo table{width:100%;border-collapse:collapse;font-size:.88rem}
.doc-corpo td,.doc-corpo th{border-top:1px solid var(--line);padding:7px 5px;text-align:left;vertical-align:top}
.doc-corpo th{font-size:.75rem;color:var(--muted);text-transform:uppercase}
.msg-edit{width:100%;font:inherit;font-size:16px;line-height:1.45;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;min-height:150px}
.msg-prev{white-space:pre-wrap;font-size:.86rem;background:#E7F6E9;color:#14301A;border-radius:12px 12px 12px 4px;padding:10px 12px;overflow-wrap:anywhere}
button.link{border:0;background:none;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
details.historico{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
details.historico>summary{display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer}
details.historico>summary .s{display:block;font-size:.82rem;color:var(--muted)}
details.historico[open] .seta{transform:rotate(180deg)}
details.historico>ul.list{border:0;border-top:1px solid var(--line);border-radius:0}
details.historico>.note{padding:10px 14px 14px}
.conta-box{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.conta-box.vazia{border:1.5px dashed var(--warn);background:var(--warn-soft)}
.conta-box>.btn-mini{align-self:flex-start}
.conta-box.vazia .s{display:block;font-size:.82rem;color:var(--muted)}
ul.list>li.quem{align-items:flex-start}
.corte{border:1px solid var(--accent);background:var(--accent-soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.corte-par{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.corte-par figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.corte-par figcaption{font-size:.8rem;font-weight:700;color:var(--muted)}
.xadrez{width:100%;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line);
  background-color:#fff;background-image:linear-gradient(45deg,#e4e6ec 25%,transparent 25%,transparent 75%,#e4e6ec 75%),linear-gradient(45deg,#e4e6ec 25%,transparent 25%,transparent 75%,#e4e6ec 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.xadrez img{max-width:88%;max-height:88%;object-fit:contain}
.corte input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.corte-escala{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.corte-msg{font-size:.88rem}
.corte-msg.alerta{color:var(--out);font-weight:600}
.previa{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.previa-topo{display:flex;align-items:center;gap:10px;font-family:var(--f-display)}
.previa-topo img{width:36px;height:36px;object-fit:contain}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
@media (max-width:420px){.big{font-size:1.85rem}.trio .pill b{font-size:.92rem}}
</style>
</head>
<body>
<div id="raiz"></div>
<div id="overlay"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="regras.js"></script>
<script src="qrcode.js"></script>
<script src="pdf-simples.js"></script>
<script src="relatorio.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
